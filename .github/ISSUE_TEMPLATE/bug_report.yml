name: Bug report
description: Something doesn't work, crashes or produces a wrong result
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected and what happened instead.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: VO Media version
      description: Shown in the app menu (e.g. 0.3).
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options: [Windows, macOS, Linux]
    validations:
      required: true
  - type: textarea
    id: log
    attributes:
      label: Log or error message
      description: Any error text or the relevant part of the log.
      render: text
